    <!-- Tombol Upload -->

<script>
    // 1. DETEKSI OTOMATIS DOMAIN & NAMA PASANGAN DARI PATH HTML
    function dapatkanDeteksiMempelaiOtomatis() {
        let origin = window.location.origin;
        let pathname = window.location.pathname;

        // Bersihkan nama file html dari path
        pathname = pathname.replace(/\/index_[0-9]+\.html$/, '').replace(/\/index\.html$/, '').replace(/\/$/, '');
        let segments = pathname.split('/').filter(Boolean);
        
        let rawSlug = segments.length > 0 ? segments[segments.length - 1] : "hana_handayani-irfan_ripandi";

        // Murni link dasar tanpa '/tamu' dan tanpa parameter nama tamu di URL nantinya
        let baseUrl = origin + pathname;

        // Format nama pasangan (Contoh: hana_handayani-irfan_ripandi -> Hana Handayani & Irfan Ripandi)
        let namaFormatted = rawSlug
            .replace(/[-_]+/g, ' & ')
            .split(' ')
            .map(word => word.length > 0 ? word.charAt(0).toUpperCase() + word.slice(1) : '')
            .join(' ');

        return {
            namaPasangan: namaFormatted || "Kedua Mempelai",
            linkUndangan: baseUrl
        };
    }

    const dataLokasi = dapatkanDeteksiMempelaiOtomatis();
    const NAMA_PASANGAN = dataLokasi.namaPasangan;
    const LINK_UNDANGAN_UTAMA = dataLokasi.linkUndangan;

    window.onload = function() {
        document.getElementById('lbl-nama-pasangan').innerText = NAMA_PASANGAN;
        document.getElementById('page-title').innerText = "Admin Generator Undangan - " + NAMA_PASANGAN;
    };

    function handleFile(event) {
        const file = event.target.files[0];
        if(!file) return;

        const reader = new FileReader();

        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            
            const sheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[sheetName];
            const jsonRows = XLSX.utils.sheet_to_json(worksheet);
            
            tampilkanData(jsonRows);
        };

        reader.readAsArrayBuffer(file);
    }

    function tampilkanData(rows) {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = "";
        
        rows.forEach(row => {
            // Fleksibel membaca nama tamu / kontak dari berbagai variasi header Excel
            const namaTamu = row["Nama"] || row["Nama Tamu"] || row["Kontak"] || row["Name"] || row["NAMA"] || row["nama"] || row["WhatsApp"] || "Tamu Undangan";
            let noHp = row["No HP"] || row["NO HP"] || row["No. HP"] || row["no hp"] || row["hp"] || row["No WhatsApp"] || "";

            if(noHp) {
                noHp = noHp.toString().trim().replace(/[^0-9]/g, '');
                if (noHp.startsWith("0")) {
                    noHp = "62" + noHp.slice(1);
                }
            }

            // Pesan WhatsApp dengan link undangan murni (tanpa embel-embel slug nama tamu)
            const teksMentah = `Assalamualaikum Wr.Wb 
*${namaTamu}*,

Tanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara/i untuk menghadiri acara pernikahan kami.

Silakan buka tautan di bawah ini untuk melihat detail undangan resmi digital kami:
${LINK_UNDANGAN_UTAMA}

Merupakan suatu kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan untuk hadir dan memberikan doa restu.

*Mohon maaf perihal undangan hanya dibagikan melalui pesan ini karena keterbatasan jarak & waktu.* 

Pesan ini adalah undangan resmi sebagai pengganti apabila undangan cetak *BELUM/TIDAK DITERIMA* oleh Bapak/Ibu/Saudara/I.
Diharapkan melalui media ini sebagai pengganti undangan resmi agar maksud dan tujuan kami dapat tersampaikan.

Terima kasih banyak atas perhatiannya.

Kami yang berbahagia,
*${NAMA_PASANGAN}*`;
            
            const pesanTeksEncoded = encodeURIComponent(teksMentah);
            const waLink = noHp ? `https://api.whatsapp.com/send?phone=${noHp}&text=${pesanTeksEncoded}` : '#';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${namaTamu}</b></td>
                <td>${noHp ? '+' + noHp : '-'}</td>
                <td>
                    ${noHp 
                        ? `<a href="${waLink}" target="_blank" class="btn-send">Kirim WA 💬</a>` 
                        : `<span style="color:#aaa; font-size:0.8rem;">Tanpa No HP</span>`
                    }
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('result-area').style.display = 'block';
    }
</script>
