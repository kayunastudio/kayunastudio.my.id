<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Generator Undangan Digital - Kayuna Studio</title>
    <!-- Library SheetJS untuk membaca file Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Library Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f7f5;
            color: #333;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
        }
        .admin-box {
            width: 100%;
            max-width: 750px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        h2 { color: #4A5D4E; margin-bottom: 5px; }
        p { font-size: 0.9rem; color: #666; margin-bottom: 20px; }
        
        .config-box {
            background: #f0f4f1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #dcdfdc;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 12px;
        }
        .form-group label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #4A5D4E;
        }
        .form-control {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .form-row .form-group { flex: 1; min-width: 150px; }

        .btn-primary {
            background-color: #4A5D4E;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .btn-primary:hover { background-color: #38483b; }

        .upload-btn {
            border: 2px dashed #4A5D4E;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            background: #f9fbf9;
            margin-top: 10px;
        }
        .upload-btn:hover { background: #eef2ef; }
        input[type="file"] { display: none; }

        .tab-container {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            border-bottom: 2px solid #ddd;
        }
        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: bold;
            color: #666;
            border-bottom: 3px solid transparent;
        }
        .tab-btn.active {
            color: #4A5D4E;
            border-bottom-color: #4A5D4E;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.9rem;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        th { background-color: #4A5D4E; color: white; }
        
        .btn-send {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-send:hover { background-color: #128C7E; }
        
        .btn-send.sent {
            background-color: #6c757d;
        }

        .btn-delete {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            margin-left: 5px;
        }
        .btn-delete:hover { background-color: #c0392b; }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .status-sent { background-color: #d4edda; color: #155724; }
        .status-pending { background-color: #fff3cd; color: #856404; }

        .studio-footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px dashed #ddd;
            text-align: center;
            font-size: 0.82rem;
            color: #777;
        }
        .studio-footer p { margin-bottom: 8px; color: #555; }
        .studio-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .studio-links a {
            color: #4A5D4E;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .studio-links a:hover { color: #C5A059; }
        .studio-links svg { width: 14px; height: 14px; fill: currentColor; }
    </style>
</head>
<body>

<div class="admin-box">
    <h2>Generator & Database Undangan</h2>
    <p>Kelola data tamu undangan digital terpisah berdasarkan jenis kelamin.</p>

    <!-- Form Input Manual -->
    <div class="config-box">
        <h4 style="margin-top:0; margin-bottom:10px; color:#4A5D4E;">Tambah Tamu Manual</h4>
        <form id="form-tamu" onsubmit="tambahTamuManual(event)">
            <div class="form-row">
                <div class="form-group">
                    <label for="input-nama">Nama Tamu</label>
                    <input type="text" id="input-nama" class="form-control" placeholder="Nama Tamu" required>
                </div>
                <div class="form-group">
                    <label for="input-hp">Nomor HP / WhatsApp</label>
                    <input type="text" id="input-hp" class="form-control" placeholder="08123456789">
                </div>
                <div class="form-group">
                    <label for="input-gender">Kategori Tamu</label>
                    <select id="input-gender" class="form-control">
                        <option value="pria">Tamu Pria</option>
                        <option value="wanita">Tamu Wanita</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn-primary">➕ Simpan Tamu</button>
        </form>

        <!-- Import Excel -->
        <div style="margin-top: 15px; border-top: 1px solid #ccc; padding-top: 10px;">
            <label style="font-size: 0.85rem; font-weight: bold; color: #4A5D4E;">atau Import via Excel (.xlsx):</label>
            <div class="upload-btn" onclick="document.getElementById('excel-file').click()">
                <span>Klik di sini untuk upload Excel</span>
                <input type="file" id="excel-file" accept=".xlsx, .xls" onchange="handleFile(event)">
            </div>
        </div>
    </div>

    <!-- Tab Filter Jenis Kelamin -->
    <div class="tab-container">
        <button class="tab-btn active" id="tab-pria" onclick="switchTab('pria')">👨 Tamu Pria (<span id="count-pria">0</span>)</button>
        <button class="tab-btn" id="tab-wanita" onclick="switchTab('wanita')">👩 Tamu Wanita (<span id="count-wanita">0</span>)</button>
    </div>

    <!-- Tabel Tampilan Data -->
    <div id="result-area">
        <table>
            <thead>
                <tr>
                    <th>Nama Tamu</th>
                    <th>No. HP</th>
                    <th>Status</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr><td colspan="4" style="text-align:center; color:#888;">Memuat data tamu...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- FOOTER ATRIBUSI LAYANAN KAYUNA STUDIO -->
    <footer class="studio-footer">
        <p>System Developed &amp; Maintained by</p>
        <div class="studio-links">
            <a href="https://kayunastudio.my.id" target="_blank">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.53c-.26-.81-1-1.4-1.9-1.4h-1v-3c0-.55-.45-1-1-1h-6v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.4z"/></svg>
                kayunastudio
            </a>
            <a href="https://instagram.com/kayunastd/" target="_blank">
                <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.051.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
                @kayunastd
            </a>
            <a href="https://tiktok.com/@kayuna.studio" target="_blank">
                <svg viewBox="0 0 24 24"><path d="M12.525.02c1.31.01 2.61-.01 3.91.02.08 1.53.63 3.02 1.73 4.09.91.91 2.14 1.47 3.42 1.62V9.61c-1.39-.12-2.74-.75-3.72-1.74-.15-.15-.29-.31-.41-.47v6.33c.09 2.12-.91 4.23-2.67 5.43-1.89 1.34-4.47 1.5-6.52.42-2.22-1.12-3.63-3.63-3.48-6.13.11-2.42 1.84-4.57 4.22-5.07.95-.21 1.95-.12 2.85.25V4.76c-1.21-.38-2.25-1.19-2.92-2.27V.02h3.01z"/></svg>
                @kayuna.studio
            </a>
        </div>
    </footer>
</div>

<script>
    // 1. KONFIGURASI SUPABASE
    const SUPABASE_URL = "https://qhuijciuvgobuvilknlu.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFodWlqY2l1dmdvYnV2aWxrbmx1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2MTUwMTQsImV4cCI6MjEwMTE5MTAxNH0.giHriDXp3Ks0VIMIh1I2Axgf4RQ-zpXTQanfz1CcCi0";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const DOMAIN_UTAMA = "https://kayunastudio.my.id";
    let dataTamu = { pria: [], wanita: [] };
    let currentTab = "pria";
    let currentSlug = "";

    // DETEKSI SLUG OTOMATIS BERDASARKAN URL / PATH
    function deteksiSlugOtomatis() {
        const urlParams = new URLSearchParams(window.location.search);
        let slugParam = urlParams.get('slug');

        if (!slugParam) {
            let path = window.location.pathname;
            path = path.replace(/\/index_[0-9]+\.html$/, '').replace(/\/index\.html$/, '');
            let segments = path.split('/').filter(Boolean);
            slugParam = (segments.length > 0 && !segments[segments.length - 1].includes('.')) 
                ? segments[segments.length - 1] 
                : "hana_handayani-irfan_ripandi";
        }

        return slugParam;
    }

    window.onload = function() {
        currentSlug = deteksiSlugOtomatis();
        muatDataSupabase();
    };

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tab-pria').classList.toggle('active', tab === 'pria');
        document.getElementById('tab-wanita').classList.toggle('active', tab === 'wanita');
        tampilkanData();
    }

    function formatNoHp(noHp) {
        if (!noHp) return "";
        let cleaned = noHp.toString().trim().replace(/[^0-9]/g, '');
        if (cleaned.startsWith("0")) {
            cleaned = "62" + cleaned.slice(1);
        }
        return cleaned;
    }

    async function muatDataSupabase() {
        if (!currentSlug) return;

        try {
            const { data, error } = await supabase
                .from('guests')
                .select('*')
                .eq('wedding_slug', currentSlug)
                .order('id', { ascending: false });

            if (error) throw error;

            dataTamu.pria = (data || []).filter(item => item.gender === 'pria');
            dataTamu.wanita = (data || []).filter(item => item.gender === 'wanita');

            document.getElementById('count-pria').innerText = dataTamu.pria.length;
            document.getElementById('count-wanita').innerText = dataTamu.wanita.length;

            tampilkanData();
        } catch (err) {
            console.error("Gagal memuat data dari Supabase:", err);
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:red;">Gagal memuat data: ${err.message || err}. Pastikan RLS / Policy di Supabase sudah dikonfigurasi.</td></tr>`;
        }
    }

    async function tambahTamuManual(e) {
        e.preventDefault();
        const nama = document.getElementById('input-nama').value.trim();
        const hp = formatNoHp(document.getElementById('input-hp').value);
        const gender = document.getElementById('input-gender').value;

        if (!currentSlug || !nama) return alert("Nama wajib diisi!");

        const { error } = await supabase
            .from('guests')
            .insert([{ 
                wedding_slug: currentSlug, 
                nama: nama, 
                no_hp: hp, 
                gender: gender,
                is_sent: false
            }]);

        if (error) {
            alert("Gagal menyimpan data: " + error.message);
        } else {
            document.getElementById('input-nama').value = "";
            document.getElementById('input-hp').value = "";
            await muatDataSupabase();
        }
    }

    function handleFile(event) {
        const file = event.target.files[0];
        if(!file) return;

        const reader = new FileReader();
        reader.onload = async function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheetName = workbook.SheetNames[0];
            const jsonRows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
            
            await simpanBatchExcel(jsonRows);
        };

        reader.readAsArrayBuffer(file);
    }

    async function simpanBatchExcel(rows) {
        const defaultGender = document.getElementById('input-gender').value;

        const payload = rows.map(row => {
            const nama = row["Nama"] || row["nama"] || "Tamu";
            const noHp = formatNoHp(row["No HP"] || row["No. HP"] || row["hp"] || "");
            const genderInput = (row["Gender"] || row["gender"] || defaultGender).toString().toLowerCase();
            const gender = (genderInput.includes("wanita") || genderInput.includes("p")) ? "wanita" : "pria";

            return {
                wedding_slug: currentSlug,
                nama: nama,
                no_hp: noHp,
                gender: gender,
                is_sent: false
            };
        });

        const { error } = await supabase.from('guests').insert(payload);

        if (error) {
            alert("Gagal import data Excel: " + error.message);
        } else {
            alert("Berhasil mengimpor " + payload.length + " data tamu!");
            await muatDataSupabase();
        }
    }

    async function hapusTamu(id) {
        if (!confirm("Apakah Anda yakin ingin menghapus data tamu ini?")) return;

        const { error } = await supabase
            .from('guests')
            .delete()
            .eq('id', id);

        if (error) {
            alert("Gagal menghapus data: " + error.message);
        } else {
            await muatDataSupabase();
        }
    }

    async function tandaiTersampaikan(id) {
        // Tandai status pesan terkirim di Supabase
        await supabase
            .from('guests')
            .update({ is_sent: true })
            .eq('id', id);

        // Perbarui tampilan lokal
        const item = [...dataTamu.pria, ...dataTamu.wanita].find(g => g.id === id);
        if (item) item.is_sent = true;
        tampilkanData();
    }

    function tampilkanData() {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = "";

        const list = dataTamu[currentTab] || [];
        const linkUndangan = `${DOMAIN_UTAMA}/${currentSlug}`;

        if (list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#888;">Belum ada data tamu ${currentTab}.</td></tr>`;
            return;
        }

        list.forEach(item => {
            const namaTamu = item.nama;
            const noHp = item.no_hp || "";
            const isSent = item.is_sent || false;

            const teksMentah = `Assalamualaikum Wr.Wb 
*${namaTamu}*,

Tanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara/i untuk menghadiri acara pernikahan kami.

Silakan buka tautan di bawah ini untuk melihat detail undangan resmi digital kami:
${linkUndangan}?to=${encodeURIComponent(namaTamu)}

Merupakan suatu kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan untuk hadir dan memberikan doa restu.

*Mohon maaf perihal undangan hanya dibagikan melalui pesan ini karena keterbatasan jarak & waktu.* 

Pesan ini adalah undangan resmi sebagai pengganti apabila undangan cetak *BELUM/TIDAK DITERIMA* oleh Bapak/Ibu/Saudara/I.

Terima kasih banyak atas perhatiannya.`;

            const pesanTeksEncoded = encodeURIComponent(teksMentah);
            const waLink = noHp ? `https://api.whatsapp.com/send?phone=${noHp}&text=${pesanTeksEncoded}` : '#';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${namaTamu}</b></td>
                <td>${noHp ? '+' + noHp : '-'}</td>
                <td>
                    ${isSent 
                        ? `<span class="status-badge status-sent">✓ Terkirim</span>` 
                        : `<span class="status-badge status-pending">Belum</span>`
                    }
                </td>
                <td>
                    ${noHp 
                        ? `<a href="${waLink}" target="_blank" onclick="tandaiTersampaikan(${item.id})" class="btn-send ${isSent ? 'sent' : ''}">
                             ${isSent ? '✓ Kirim Ulang WA' : '💬 Kirim WA'}
                           </a>` 
                        : `<span style="color:#aaa; font-size:0.8rem;">Tanpa No HP</span>`
                    }
                    <button class="btn-delete" onclick="hapusTamu(${item.id})">🗑️ Hapus</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }
</script>

</body>
</html>
