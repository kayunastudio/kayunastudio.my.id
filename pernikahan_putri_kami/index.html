<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .font-serif-title {
            font-family: 'Alex Brush', cursive;
        }
        .font-playfair {
            font-family: 'Playfair Display', serif;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FAF5EF;
        }
        /* Transisi halus saat membuka undangan */
        #cover {
            transition: opacity 0.8s ease-in-out, visibility 0.8s;
        }
        #cover.hide {
            opacity: 0;
            visibility: hidden;
        }
    </style>
</head>
<body class="text-[#5A453E] antialiased flex justify-center items-center min-h-screen">

    <!-- CONTAINER UTAMA (RESPONSIF MOBILE / TAMPILAN HP) -->
    <div class="relative w-full max-w-md min-h-screen bg-[#FFF9F2] shadow-2xl overflow-hidden flex flex-col justify-between border-x border-[#EFE1D1]">

        <!-- ================= COVER UNDANGAN ESTETIK (PEACH & CREAM) ================= -->
        <div id="cover" class="absolute inset-0 z-50 flex flex-col justify-between items-center p-8 text-center bg-gradient-to-b from-[#FFF9F2] via-[#FAF3EC] to-[#F5E8DD]">
            
            <!-- Ornamen Bingkai Atas & Header -->
            <div class="pt-10 space-y-3 w-full flex flex-col items-center">
                <div class="w-12 h-0.5 bg-[#D99382]/50 mb-1"></div>
                <p class="text-[11px] uppercase tracking-[0.35em] text-[#A67B6F] font-semibold">Pernikahan Putri Kami</p>
                <h1 class="text-6xl font-serif-title text-[#8C5243] py-2 drop-shadow-sm">Hana & Irfan</h1>
                <div class="w-12 h-0.5 bg-[#D99382]/50 mt-1"></div>
            </div>

            <!-- Kartu Kepada Yth. Estetik -->
            <div class="bg-white/70 border border-[#E8CEB8] rounded-3xl p-6 w-full backdrop-blur-md shadow-lg shadow-[#E5D2C3]/40 space-y-2 relative overflow-hidden">
                <div class="absolute -top-6 -right-6 w-16 h-16 bg-[#F5D8CE]/30 rounded-full blur-xl"></div>
                <div class="absolute -bottom-6 -left-6 w-16 h-16 bg-[#E8D8C8]/30 rounded-full blur-xl"></div>
                
                <p class="text-[10px] uppercase tracking-widest text-[#A67B6F] font-medium">Kepada Yth.</p>
                <p class="text-xs text-[#8C766B] font-light">Bapak/Ibu/Saudara/i:</p>
                <h2 id="guest-name" class="text-lg font-playfair font-bold text-[#733F32] pt-1">Tamu Undangan</h2>
            </div>

            <!-- Tombol Buka Undangan -->
            <div class="pb-10 w-full">
                <button onclick="bukaUndangan()" class="w-full bg-gradient-to-r from-[#D99382] via-[#C48473] to-[#B37262] hover:from-[#C48473] hover:to-[#A36252] text-white font-medium py-3.5 px-6 rounded-2xl shadow-lg shadow-[#D99382]/30 transition duration-300 transform active:scale-95 flex items-center justify-center gap-2.5 text-sm tracking-wide">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-amber-100" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                    <span>Buka Undangan</span>
                </button>
            </div>
        </div>

        <!-- ================= KONTEN UTAMA (VIDEO) ================= -->
        <div class="relative w-full h-full flex-grow flex flex-col justify-end">
            <!-- Video Utama -->
            <video id="main-video" class="absolute inset-0 w-full h-full object-cover z-0" loop playsinline muted>
                <source src="https://raw.githubusercontent.com/kayunastudio/kayunastudio.my.id/main/pernikahan_putri_kami/pernikahan-putri.mp4" type="video/mp4">
                Browser Anda tidak mendukung pemutar video.
            </video>

            <!-- Overlay Gradien Lembut di Bawah Video untuk Keterbacaan Tombol -->
            <div class="absolute inset-x-0 bottom-0 h-44 bg-gradient-to-t from-[#2C1A16]/80 via-[#2C1A16]/30 to-transparent z-10 pointer-events-none"></div>

            <!-- Area Tombol Lokasi -->
            <div class="relative z-20 p-6 pb-12 w-full text-center">
                <a href="https://maps.app.goo.gl/ky1oxmMaZ8Rz8wfVA" target="_blank" class="inline-flex items-center justify-center gap-2 w-full bg-[#FFF9F2]/90 hover:bg-white text-[#733F32] border border-[#E8CEB8] font-semibold py-3.5 px-6 rounded-2xl backdrop-blur-md shadow-2xl transition duration-300 transform active:scale-95 text-xs tracking-wider uppercase">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-[#D99382]" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
                    </svg>
                    Lihat Lokasi Pernikahan
                </a>
            </div>
        </div>

    </div>

    <!-- SCRIPT JAVASCRIPT LOGIKA UNDANGAN -->
    <script>
        // Logika Mengambil Nama Tamu dari URL Parameter (contoh: ?to=Nama+Tamu)
        const urlParams = new URLSearchParams(window.location.search);
        const guestName = urlParams.get('to');
        if (guestName) {
            document.getElementById('guest-name').innerText = guestName;
        }

        // Logika Buka Undangan & Putar Video Secara Otomatis dengan Suara
        function bukaUndangan() {
            const cover = document.getElementById('cover');
            const video = document.getElementById('main-video');

            // Sembunyikan Cover
            cover.classList.add('hide');

            // Unmute dan Putar Video
            video.muted = false;
            video.play().catch(error => {
                console.log("Auto-play terhalang oleh browser policy:", error);
            });
        }
    </script>
</body>
</html>
